<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGI SLATE</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&amp;family=Orbitron:wght@400;700;900&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.min.js"></script>
  <style>
        :root {
            --cyan: #00f5ff;
            --purple: #a855f7;
            --pink: #ec4899;
            --blue: #3b82f6;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Raleway', sans-serif; margin: 0; overflow: hidden; background: #0a0a1a; color: #e0e0ff; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 15, 40, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(0, 245, 255, 0.15); border-radius: 16px; }
        .glass-strong { background: rgba(20, 20, 50, 0.8); backdrop-filter: blur(30px); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 16px; }
        .neon-border { box-shadow: 0 0 10px rgba(0, 245, 255, 0.3), inset 0 0 10px rgba(0, 245, 255, 0.05); }
        .neon-text { text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan); }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s, transform 0.8s; }
        .screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse-dot 2s infinite; }
        .status-dot.green { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.yellow { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .status-dot.red { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes glow-pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
        .btn-cyber { transition: all 0.2s; cursor: pointer; user-select: none; }
        .btn-cyber:hover { transform: scale(1.05); filter: brightness(1.2); }
        .btn-cyber:active { transform: scale(0.95); }
        #drawing-canvas { cursor: crosshair; }
        .control-btn { width: 100%; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid rgba(0,245,255,0.1); background: rgba(15,15,40,0.5); color: #c0c0ff; }
        .control-btn:hover { background: rgba(0,245,255,0.1); border-color: rgba(0,245,255,0.3); }
        .control-btn.active { background: rgba(0,245,255,0.15); border-color: var(--cyan); color: var(--cyan); }
        .splash-logo { font-size: 3rem; animation: glow-pulse 2s infinite; }
        .progress-bar { height: 4px; background: rgba(0,245,255,0.2); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); transition: width 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,245,255,0.3); border-radius: 3px; }
    </style>
 </head>
 <body>
  <canvas id="particles-canvas"></canvas>

  <!-- Splash Screen -->
  <div id="splash-screen" class="screen">
   <div class="text-center">
    <div class="splash-logo font-orbitron font-bold neon-text">DIGI SLATE</div>
    <p class="mt-4 text-cyan-300 opacity-70">Initializing Neural Interface...</p>
    <div class="progress-bar w-64 mx-auto mt-8">
     <div id="splash-progress" class="progress-fill" style="width:0%"></div>
    </div>
   </div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen" class="screen hidden">
   <div class="glass-strong neon-border p-8 w-full max-w-sm">
    <h2 class="font-orbitron text-xl text-center neon-text mb-6">ACCESS PORTAL</h2>
    <form id="login-form" class="space-y-4">
     <div>
      <label for="login-email" class="text-xs text-cyan-300 uppercase tracking-wider">Email</label> 
      <input id="login-email" type="email" class="w-full mt-1 px-4 py-2 rounded-lg bg-black/40 border border-cyan-500/30 text-white focus:outline-none focus:border-cyan-400" placeholder="operator@aether.io">
     </div>
     <div>
      <label for="login-pass" class="text-xs text-cyan-300 uppercase tracking-wider">Password</label> 
      <input id="login-pass" type="password" class="w-full mt-1 px-4 py-2 rounded-lg bg-black/40 border border-cyan-500/30 text-white focus:outline-none focus:border-cyan-400" placeholder="••••••••">
     </div>
     <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer"> 
      <input type="checkbox" id="remember-me" class="accent-cyan-400"> Remember Me 
     </label> 
     <button type="submit" class="btn-cyber w-full py-3 rounded-lg bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-bold uppercase tracking-wider">Enter</button>
    </form>
   </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" class="screen hidden" style="flex-direction:column; align-items:stretch;">
   <!-- Header -->
   <header class="glass px-4 py-2 mx-2 mt-2 flex items-center justify-between gap-4 relative z-10" style="border-radius:12px;">
    <div class="flex items-center gap-3">
     <h1 class="font-orbitron font-bold text-lg neon-text">DIGI SLATE</h1>
     <span class="text-[10px] text-purple-300 opacity-70">AI Gesture Smart board</span>
    </div>
    <div class="flex items-center gap-4 text-[11px]">
     <span class="flex items-center gap-1"><span id="cam-dot" class="status-dot yellow"></span><span id="cam-status">Loading</span></span> 
     <span class="flex items-center gap-1"><span id="hand-dot" class="status-dot red"></span><span id="hand-status">No Hand</span></span> 
     <span class="flex items-center gap-1"><span id="draw-dot" class="status-dot green"></span><span id="draw-status">Ready</span></span> 
     <span class="text-cyan-400">FPS: <span id="fps-display">0</span></span> 
     <span class="text-purple-300">Gesture: <span id="gesture-display">None</span></span>
    </div>
   </header>

   <!-- Main Content -->
   <div class="flex flex-1 gap-2 p-2 overflow-hidden" style="min-height:0;">
    <!-- Left: Camera + Canvas -->
    <div class="flex-1 relative glass neon-border overflow-hidden" style="min-width:0;">
     <video id="camera-video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover opacity-30" style="transform:scaleX(-1);"></video>
     <canvas id="hand-canvas" class="absolute inset-0 w-full h-full"></canvas>
     <canvas id="drawing-canvas" class="absolute inset-0 w-full h-full"></canvas>
     <div id="math-result" class="absolute bottom-4 left-4 glass px-4 py-2 text-cyan-300 font-mono text-sm hidden"></div>
     <div id="shape-result" class="absolute top-4 left-4 glass px-3 py-1 text-purple-300 text-xs hidden"></div>
    </div>

    <!-- Right: Controls -->
    <aside class="w-56 flex flex-col gap-2 overflow-y-auto pr-1" style="min-height:0;">
     <div class="glass-strong p-3 space-y-2">
      <h3 class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold mb-2">Tools</h3>
      <button id="btn-gesture" class="control-btn active" onclick="toggleGesture()"><i data-lucide="hand" style="width:14px;height:14px;"></i>Air Gestures</button> 
      <button id="btn-mouse" class="control-btn active" onclick="toggleMouse()"><i data-lucide="mouse-pointer" style="width:14px;height:14px;"></i>Mouse Draw</button> 
      <button id="btn-voice" class="control-btn" onclick="toggleVoice()"><i data-lucide="mic" style="width:14px;height:14px;"></i>Voice Commands</button> 
      <button id="btn-math" class="control-btn" onclick="toggleMath()"><i data-lucide="calculator" style="width:14px;height:14px;"></i>Math Solver</button> 
      <button id="btn-shape" class="control-btn" onclick="toggleShape()"><i data-lucide="shapes" style="width:14px;height:14px;"></i>Shape Recognition</button>
     </div>
     <div class="glass-strong p-3 space-y-2">
      <h3 class="text-[10px] uppercase tracking-widest text-purple-400 font-bold mb-2">Brush</h3>
      <div class="flex items-center gap-2">
       <label class="text-[10px] text-gray-400 w-10">Size</label> 
       <input id="brush-size" type="range" min="1" max="30" value="4" class="flex-1 accent-cyan-400" oninput="updateBrush()">
      </div>
      <div class="flex items-center gap-2">
       <label class="text-[10px] text-gray-400 w-10">Color</label> 
       <input id="brush-color" type="color" value="#00f5ff" class="w-8 h-6 rounded border-0 cursor-pointer" oninput="updateBrush()">
      </div>
      <div class="flex items-center gap-2">
       <label class="text-[10px] text-gray-400 w-10">Glow</label> 
       <input id="brush-glow" type="range" min="0" max="30" value="12" class="flex-1 accent-purple-400" oninput="updateBrush()">
      </div>
      <select id="brush-type" class="w-full text-xs rounded-lg px-2 py-1 bg-black/40 border border-purple-500/30 text-white" onchange="updateBrush()">
       <option value="glow">Glow Brush</option> 
       <option value="neon">Neon Brush</option> 
       <option value="pen">Pen</option> 
       <option value="marker">Marker</option> 
       <option value="eraser">Eraser</option> 
      </select>
     </div>
     <div class="glass-strong p-3 space-y-2">
      <h3 class="text-[10px] uppercase tracking-widest text-pink-400 font-bold mb-2">Actions</h3>
      <div class="grid grid-cols-2 gap-1">
       <button class="control-btn justify-center" onclick="undo()"><i data-lucide="undo" style="width:12px;height:12px;"></i>Undo</button> 
       <button class="control-btn justify-center" onclick="redo()"><i data-lucide="redo" style="width:12px;height:12px;"></i>Redo</button> 
       <button class="control-btn justify-center" onclick="clearCanvas()"><i data-lucide="trash-2" style="width:12px;height:12px;"></i>Clear</button> 
       <button class="control-btn justify-center" onclick="saveCanvas()"><i data-lucide="save" style="width:12px;height:12px;"></i>Save</button> 
       <button class="control-btn justify-center col-span-2" onclick="exportCanvas()"><i data-lucide="download" style="width:12px;height:12px;"></i>Export PNG</button>
      </div>
     </div>
    </aside>
   </div>
  </div>

  <script>
    // ========== PARTICLES ==========
    (function() {
        const pc = document.getElementById('particles-canvas');
        const pctx = pc.getContext('2d');
        let particles = [];
        function resizeParticles() { pc.width = window.innerWidth; pc.height = window.innerHeight; }
        resizeParticles();
        window.addEventListener('resize', resizeParticles);
        for (let i = 0; i < 60; i++) {
            particles.push({ x: Math.random()*pc.width, y: Math.random()*pc.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*2+0.5, color: ['#00f5ff','#a855f7','#ec4899','#3b82f6'][Math.floor(Math.random()*4)] });
        }
        function animParticles() {
            pctx.clearRect(0,0,pc.width,pc.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = pc.width; if (p.x > pc.width) p.x = 0;
                if (p.y < 0) p.y = pc.height; if (p.y > pc.height) p.y = 0;
                pctx.beginPath(); pctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                pctx.fillStyle = p.color; pctx.globalAlpha = 0.4; pctx.fill();
            });
            pctx.globalAlpha = 1;
            requestAnimationFrame(animParticles);
        }
        animParticles();
    })();

    // ========== SCREENS ==========
    let splashProgress = 0;
    const splashInterval = setInterval(() => {
        splashProgress += Math.random()*15+5;
        if (splashProgress >= 100) splashProgress = 100;
        document.getElementById('splash-progress').style.width = splashProgress+'%';
        if (splashProgress >= 100) {
            clearInterval(splashInterval);
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
                const saved = localStorage.getItem('aether-auth');
                if (saved) { showDashboard(); } else { document.getElementById('login-screen').classList.remove('hidden'); }
            }, 500);
        }
    }, 200);

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        if (document.getElementById('remember-me').checked) localStorage.setItem('aether-auth','1');
        document.getElementById('login-screen').classList.add('hidden');
        showDashboard();
    });

    function showDashboard() {
        document.getElementById('dashboard').classList.remove('hidden');
        resizeDrawingCanvas();
        initCamera();
    }

    // ========== DRAWING ENGINE ==========
    const drawCanvas = document.getElementById('drawing-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    let brush = { size: 4, color: '#00f5ff', glow: 12, type: 'glow' };
    let isDrawing = false, mouseEnabled = true, gestureEnabled = true;
    let undoStack = [], redoStack = [];
    let lastX = 0, lastY = 0;

    function resizeDrawingCanvas() {
        const rect = drawCanvas.parentElement.getBoundingClientRect();
        drawCanvas.width = rect.width; drawCanvas.height = rect.height;
        const hc = document.getElementById('hand-canvas');
        hc.width = rect.width; hc.height = rect.height;
        redrawFromStack();
    }
    window.addEventListener('resize', resizeDrawingCanvas);

    function saveState() { undoStack.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height)); if (undoStack.length > 50) undoStack.shift(); redoStack = []; }
    function undo() { if (!undoStack.length) return; redoStack.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height)); drawCtx.putImageData(undoStack.pop(),0,0); }
    function redo() { if (!redoStack.length) return; undoStack.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height)); drawCtx.putImageData(redoStack.pop(),0,0); }
    function clearCanvas() { saveState(); drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height); }
    function redrawFromStack() { if (undoStack.length) drawCtx.putImageData(undoStack[undoStack.length-1],0,0); }

    function drawLine(x1,y1,x2,y2) {
        drawCtx.beginPath();
        drawCtx.moveTo(x1,y1); drawCtx.lineTo(x2,y2);
        drawCtx.strokeStyle = brush.type==='eraser'?'rgba(0,0,0,1)':brush.color;
        drawCtx.lineWidth = brush.size;
        drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
        if (brush.type==='eraser') { 
            drawCtx.globalCompositeOperation='destination-out'; 
        } else { 
            drawCtx.globalCompositeOperation='source-over'; 
            drawCtx.shadowColor=brush.color; 
            drawCtx.shadowBlur=brush.glow; 
        }
        drawCtx.stroke();
        drawCtx.shadowBlur = 0;
    }

    drawCanvas.addEventListener('mousedown', e => { if (!mouseEnabled) return; saveState(); isDrawing=true; [lastX,lastY]=[e.offsetX,e.offsetY]; });
    drawCanvas.addEventListener('mousemove', e => { if (!isDrawing||!mouseEnabled) return; drawLine(lastX,lastY,e.offsetX,e.offsetY); [lastX,lastY]=[e.offsetX,e.offsetY]; });
    drawCanvas.addEventListener('mouseup', () => isDrawing=false);
    drawCanvas.addEventListener('mouseleave', () => isDrawing=false);

    function updateBrush() {
        brush.size = +document.getElementById('brush-size').value;
        brush.color = document.getElementById('brush-color').value;
        brush.glow = +document.getElementById('brush-glow').value;
        brush.type = document.getElementById('brush-type').value;
    }

    function saveCanvas() { const a=document.createElement('a'); a.href=drawCanvas.toDataURL('image/png'); a.download='aether-board.png'; a.click(); }
    function exportCanvas() { saveCanvas(); }

    // ========== CAMERA & MEDIAPIPE ==========
    let cameraStream = null, handsModel = null;
    let prevFingerTip = null, gestureDrawing = false, gesturePaused = false;
    let fpsFrames = 0, fpsTime = performance.now();

    async function initCamera() {
        const video = document.getElementById('camera-video');
        const camDot = document.getElementById('cam-dot');
        const camStatus = document.getElementById('cam-status');
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
            video.srcObject = cameraStream;
            await video.play();
            camDot.className = 'status-dot green'; camStatus.textContent = 'Connected';
            initMediaPipe(video);
        } catch(e) {
            camDot.className = 'status-dot red'; camStatus.textContent = 'No Camera';
            setTimeout(initCamera, 3000);
        }
    }

    function initMediaPipe(video) {
        handsModel = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
        handsModel.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        handsModel.onResults(onHandResults);

        async function processVideoFrame() {
            if (video.readyState >= 2) {
                await handsModel.send({ image: video });
            }
            requestAnimationFrame(processVideoFrame);
        }
        processVideoFrame();
    }

    function onHandResults(results) {
        fpsFrames++;
        const now = performance.now();
        if (now - fpsTime >= 1000) { 
            document.getElementById('fps-display').textContent = fpsFrames; 
            fpsFrames = 0; 
            fpsTime = now; 
        }

        const hc = document.getElementById('hand-canvas');
        const hctx = hc.getContext('2d');
        hctx.clearRect(0, 0, hc.width, hc.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            document.getElementById('hand-dot').className = 'status-dot green';
            document.getElementById('hand-status').textContent = 'Hand Detected';

            const landmarks = results.multiHandLandmarks[0];
            drawHandLandmarks(hctx, landmarks, hc.width, hc.height);

            if (gestureEnabled) processGestures(landmarks);
        } else {
            document.getElementById('hand-dot').className = 'status-dot red';
            document.getElementById('hand-status').textContent = 'No Hand';
            document.getElementById('gesture-display').textContent = 'None';
            prevFingerTip = null;
            gestureDrawing = false;
        }
    }

    function drawHandLandmarks(ctx, landmarks, w, h) {
        ctx.fillStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 8;
        const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
        ctx.strokeStyle = 'rgba(168,85,247,0.6)'; ctx.lineWidth = 2;
        connections.forEach(([a,b]) => {
            ctx.beginPath(); 
            ctx.moveTo((1 - landmarks[a].x) * w, landmarks[a].y * h); 
            ctx.lineTo((1 - landmarks[b].x) * w, landmarks[b].y * h); 
            ctx.stroke();
        });
        landmarks.forEach((lm, i) => {
            ctx.beginPath(); 
            ctx.arc((1 - lm.x) * w, lm.y * h, [4,8,12,16,20].includes(i)?6:3, 0, Math.PI*2); 
            ctx.fill();
        });
        ctx.shadowBlur = 0;
    }

    function countFingers(landmarks) {
        const thumbUp = Math.abs(landmarks[4].x - landmarks[2].x) > 0.05;
        const indexUp = landmarks[8].y < landmarks[6].y;
        const middleUp = landmarks[12].y < landmarks[10].y;
        const ringUp = landmarks[16].y < landmarks[14].y;
        const pinkyUp = landmarks[20].y < landmarks[18].y;
        return { 
            thumb: thumbUp, 
            index: indexUp, 
            middle: middleUp, 
            ring: ringUp, 
            pinky: pinkyUp, 
            count: [thumbUp, indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length 
        };
    }

    function processGestures(landmarks) {
        const fingers = countFingers(landmarks);
        const canvasW = drawCanvas.width, canvasH = drawCanvas.height;
        const cx = (1 - landmarks[8].x) * canvasW;
        const cy = landmarks[8].y * canvasH;

        let gestureName = 'None';

        if (fingers.count === 1 && fingers.index) {
            gestureName = 'Draw';
            if (prevFingerTip) {
                if (!gestureDrawing) { saveState(); gestureDrawing = true; }
                drawLine(prevFingerTip.x, prevFingerTip.y, cx, cy);
            }
            prevFingerTip = { x: cx, y: cy };
            document.getElementById('draw-status').textContent = 'Drawing';
            document.getElementById('draw-dot').className = 'status-dot green';
        } else if (fingers.count === 2 && fingers.index && fingers.middle) {
            gestureName = 'Pointer Mode';
            prevFingerTip = null;
            gestureDrawing = false;
        } else if (fingers.count >= 3 && fingers.index && fingers.middle && fingers.ring) {
            gestureName = 'Erase';
            if (prevFingerTip) {
                const savedComp = drawCtx.globalCompositeOperation;
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.beginPath(); drawCtx.arc(cx, cy, 25, 0, Math.PI*2); drawCtx.fill();
                drawCtx.globalCompositeOperation = savedComp;
            }
            prevFingerTip = { x: cx, y: cy };
        } else if (fingers.count === 0) {
            gestureName = 'Fist (Pause)';
            gestureDrawing = false;
            prevFingerTip = null;
        } else {
            prevFingerTip = null;
            gestureDrawing = false;
        }

        if (fingers.count !== 1) { 
            gestureDrawing = false; 
            prevFingerTip = null; 
            document.getElementById('draw-status').textContent = 'Ready'; 
        }
        document.getElementById('gesture-display').textContent = gestureName;
    }

    // ========== TOGGLES ==========
    function toggleGesture() { gestureEnabled = !gestureEnabled; document.getElementById('btn-gesture').classList.toggle('active'); }
    function toggleMouse() { mouseEnabled = !mouseEnabled; document.getElementById('btn-mouse').classList.toggle('active'); }

    let voiceEnabled = false, recognition = null;
    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        document.getElementById('btn-voice').classList.toggle('active');
        if (voiceEnabled) startVoice(); else if (recognition) recognition.stop();
    }
    function startVoice() {
        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return;
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR(); recognition.continuous = true; recognition.interimResults = false;
        recognition.onresult = e => {
            const cmd = e.results[e.results.length-1][0].transcript.trim().toLowerCase();
            if (cmd.includes('undo')) undo();
            else if (cmd.includes('redo')) redo();
            else if (cmd.includes('clear')) clearCanvas();
            else if (cmd.includes('save')) saveCanvas();
        };
        recognition.onend = () => { if (voiceEnabled) recognition.start(); };
        recognition.start();
    }

    let mathMode = false, shapeMode = false;
    function toggleMath() { mathMode = !mathMode; document.getElementById('btn-math').classList.toggle('active'); }
    function toggleShape() { shapeMode = !shapeMode; document.getElementById('btn-shape').classList.toggle('active'); }
