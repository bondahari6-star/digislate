<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMPUS 360| Integrated College Management Portal</title>
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       1. CSS VARIABLES & RESET
       ========================================================================== */
    :root {
      --primary-navy: #0f172a;
      --secondary-navy: #1e293b;
      --accent-blue: #2563eb;
      --accent-cyan: #06b6d4;
      --accent-hover: #1d4ed8;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --text-light: #f1f5f9;
      --border-color: #e2e8f0;
      
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;

      --sidebar-width: 260px;
      --header-height: 70px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Common Utility Classes */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 0.5rem; }
    .gap-4 { gap: 1rem; }
    .gap-6 { gap: 1.5rem; }
    .w-full { width: 100%; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ==========================================================================
       2. TYPOGRAPHY & BUTTONS
       ========================================================================== */
    h1, h2, h3, h4, h5, h6 { color: var(--primary-navy); font-weight: 700; line-height: 1.2; }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background: var(--border-color); color: var(--text-main); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { border: 1.5px solid var(--accent-blue); color: var(--accent-blue); background: transparent; }
    .btn-outline:hover { background: var(--accent-blue); color: white; }
    .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.75rem; }

    .badge {
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }

    /* ==========================================================================
       3. HOME PAGE (PUBLIC PORTAL)
       ========================================================================== */
    .public-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-height);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: white;
      text-decoration: none;
    }
    .brand-logo i { font-size: 1.8rem; color: var(--accent-cyan); }
    .brand-title { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
    .brand-subtitle { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: var(--transition); }
    .nav-links a:hover { color: var(--accent-cyan); }

    .hero-section {
      position: relative;
      min-height: 100vh;
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                  url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 1rem 2rem 1rem;
    }

    .hero-content {
      max-width: 900px;
      color: white;
      z-index: 1;
    }
    .hero-badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      border-radius: 50px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .hero-title { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; color: white; }
    .hero-tagline { font-size: 1.5rem; color: #cbd5e1; font-weight: 300; margin-bottom: 2rem; }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .portal-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: var(--radius);
      text-align: center;
      transition: var(--transition);
      cursor: pointer;
    }
    .portal-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-cyan);
      box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.3);
    }
    .portal-icon {
      width: 60px; height: 60px;
      background: rgba(127, 146, 187, 0.2);
      color: var(--accent-cyan);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto 1rem auto;
    }

    /* Public Content Sections */
    .public-section { padding: 5rem 2rem; max-width: 1200px; margin: 0 auto; }
    .section-title { text-align: center; font-size: 2.25rem; margin-bottom: 3rem; color: var(--primary-navy); }

    /* ==========================================================================
       4. AUTHENTICATION (LOGIN MODALS / VIEWS)
       ========================================================================== */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .auth-card {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      animation: modalSlideUp 0.3s ease-out;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close-auth {
      position: absolute;
      top: 1.25rem; right: 1.25rem;
      background: none; border: none;
      font-size: 1.25rem; color: var(--text-muted);
      cursor: pointer;
    }

    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header i { font-size: 2.5rem; color: var(--accent-blue); margin-bottom: 0.5rem; }

    .form-group { margin-bottom: 1.25rem; text-align: left; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--primary-navy); }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .demo-credentials-panel {
      margin-top: 1.5rem;
      padding: 0.875rem;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-left: 3px solid var(--accent-cyan);
    }

    /* ==========================================================================
       5. DASHBOARD LAYOUT (STUDENT, FACULTY, ADMIN)
       ========================================================================== */
    .app-container { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--primary-navy);
      color: white;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
      transition: var(--transition);
    }

    .sidebar-header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-menu {
      list-style: none;
      padding: 1rem 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    .sidebar-menu li a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 1.5rem;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      border-left: 3px solid transparent;
    }

    .sidebar-menu li a:hover,
    .sidebar-menu li a.active {
      color: white;
      background: rgba(255, 255, 255, 0.05);
      border-left-color: var(--accent-cyan);
    }

    .sidebar-menu li a i { width: 20px; text-align: center; }

    /* Main Workspace */
    .main-wrapper {
      flex-grow: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .top-header {
      height: var(--header-height);
      background: white;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }

    .content-body {
      padding: 2rem;
      flex-grow: 1;
    }

    /* Page Navigation & Back Button */
    .page-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    /* Cards & Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .stat-icon {
      width: 50px; height: 50px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }

    .data-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .custom-table th {
      background: var(--bg-light);
      padding: 0.875rem 1rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .custom-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .custom-table tr:hover { background: #f8fafc; }

    /* ==========================================================================
       6. DIGITAL BOARD (CANVAS FOR FACULTY / VIEWER FOR STUDENT)
       ========================================================================== */
    .canvas-container {
      background: #1e293b;
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-toolbar {
      background: rgb(63, 32, 32);
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    #digitalBoardCanvas {
      background: white;
      border-radius: 8px;
      cursor: crosshair;
      box-shadow: var(--shadow-md);
      max-width: 100%;
    }

    /* ==========================================================================
       7. TOAST NOTIFICATIONS & MODALS
       ========================================================================== */
    .toast-container {
      position: fixed;
      bottom: 2rem; right: 2rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .toast {
      background: var(--primary-navy);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: toastIn 0.3s ease;
      min-width: 280px;
    }

    @keyframes toastIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 2500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-content {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }

    /* Responsive Breakdown */
    @media (max-width: 992px) {
      .sidebar { width: 70px; }
      .sidebar-title, .menu-text { display: none; }
      .main-wrapper { margin-left: 70px; }
      .hero-title { font-size: 2.5rem; }
    }

    @media (max-width: 768px) {
      .public-header { padding: 0 1rem; }
      .nav-links { display: none; }
      .top-header { padding: 0 1rem; }
      .content-body { padding: 1rem; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- GENERIC MODAL CONTAINER -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-content" id="modalBody"></div>
  </div>

  <!-- ==========================================================================
     MAIN APP CONTAINER (SPA ROUTER TARGETS)
     ========================================================================== -->
  <div id="app"></div>

  <!-- ==========================================================================
     JAVASCRIPT LOGIC
     ========================================================================== -->
  <script>
    /* ==========================================================================
       1. DATA ARCHITECTURE & LOCALSTORAGE INITIALIZATION
       ========================================================================== */
    const DB_KEYS = {
      STUDENTS: 'smartCampus_students',
      FACULTY: 'smartCampus_faculty',
      ADMIN: 'smartCampus_admin',
      FEES: 'smartCampus_fees',
      ATTENDANCE: 'smartCampus_attendance',
      MARKS: 'smartCampus_marks',
      RESULTS: 'smartCampus_results',
      ASSIGNMENTS: 'smartCampus_assignments',
      NOTIFICATIONS: 'smartCampus_notifications',
      TIMETABLE: 'smartCampus_timetable',
      EXAMS: 'smartCampus_exams',
      MATERIALS: 'smartCampus_materials',
      BOARDS: 'smartCampus_boards',
      ADMISSIONS: 'smartCampus_admissions',
      ANNOUNCEMENTS: 'smartCampus_announcements',
      DAILY_UPDATES: 'smartCampus_dailyUpdates',
      CURRENT_USER: 'smartCampus_currentUser'
    };

    // Helper functions for LocalStorage
    function getDB(key) {
      return JSON.parse(localStorage.getItem(key)) || [];
    }
    function setDB(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    // Seed Initial Realistic Data if empty
    function seedInitialData() {
      if (!localStorage.getItem(DB_KEYS.STUDENTS)) {
        const students = Array.from({ length: 10 }, (_, i) => {
          const idNum = String(i + 1).padStart(3, '0');

            studentId: `STU${idNum}`,
            hallTicket: `20A81A05${hallNum}`,
            name: `Student ${i + 1} Kumar`,
            email: `student${i + 1}@smartcampus.edu`,
            password: 'student123',
            department: i % 2 === 0 ? 'CSE' : 'ECE',
            course: 'B.Tech',
            year: '3rd Year',
            section: 'A',
            phone: `987654321${i}`,
            academicYear: '2026-2027',
            admissionDate: '2023-08-15'
          };
        });
        setDB(DB_KEYS.STUDENTS, students);
      }

      if (!localStorage.getItem(DB_KEYS.FACULTY)) {
        const faculty = [
          { facultyId: 'FAC001', name: 'Dr. R. Kumar', email: 'faculty@gmail.com', password: 'faculty123', department: 'CSE', phone: '9123456789', subjects: ['DBMS', 'Java', 'Computer Networks'], assignedClasses: ['3rd Year - Sec A'] },
          { facultyId: 'FAC002', name: 'Prof. A. Sharma', email: 'sharma@smartcampus.edu', password: 'faculty123', department: 'ECE', phone: '9123456788', subjects: ['VLSI', 'Embedded Systems'], assignedClasses: ['3rd Year - Sec B'] },
          { facultyId: 'FAC003', name: 'Dr. M. Verma', email: 'verma@smartcampus.edu', password: 'faculty123', department: 'CSE', phone: '9123456787', subjects: ['Artificial Intelligence', 'Data Structures'], assignedClasses: ['2nd Year - Sec A'] }
        ];
        setDB(DB_KEYS.FACULTY, faculty);
      }

      if (!localStorage.getItem(DB_KEYS.ADMIN)) {
        setDB(DB_KEYS.ADMIN, [{ adminId: 'ADM001', email: 'admin@smartcampus.com', password: 'admin123', name: 'Main Administration' }]);
      }

      if (!localStorage.getItem(DB_KEYS.FEES)) {
        const fees = [
          { feeId: 'FEE001', studentId: 'STU001', feeType: 'Tuition Fee', totalAmount: 60000, paidAmount: 45000, pendingAmount: 15000, dueDate: '2026-08-30', paymentDate: '2026-01-10', transactionNo: 'TXN987654', status: 'PARTIAL' },
          { feeId: 'FEE002', studentId: 'STU001', feeType: 'Exam Fee', totalAmount: 2500, paidAmount: 2500, pendingAmount: 0, dueDate: '2026-05-15', paymentDate: '2026-05-10', transactionNo: 'TXN123456', status: 'PAID' },
          { feeId: 'FEE003', studentId: 'STU002', feeType: 'Tuition Fee', totalAmount: 60000, paidAmount: 60000, pendingAmount: 0, dueDate: '2026-08-30', paymentDate: '2026-02-01', transactionNo: 'TXN554433', status: 'PAID' }
        ];
        setDB(DB_KEYS.FEES, fees);
      }

      if (!localStorage.getItem(DB_KEYS.ATTENDANCE)) {
        const attendance = [
          { id: '1', studentId: 'STU001', studentName: 'Student 1 Kumar', subject: 'DBMS', facultyId: 'FAC001', date: '2026-08-08', status: 'Present' },
          { id: '2', studentId: 'STU001', studentName: 'Student 1 Kumar', subject: 'DBMS', facultyId: 'FAC001', date: '2026-08-07', status: 'Absent' },
          { id: '3', studentId: 'STU001', studentName: 'Student 1 Kumar', subject: 'Java', facultyId: 'FAC001', date: '2026-08-08', status: 'Present' },
          { id: '4', studentId: 'STU001', studentName: 'Student 1 Kumar', subject: 'Computer Networks', facultyId: 'FAC001', date: '2026-08-08', status: 'Present' },
          { id: '5', studentId: 'STU001', studentName: 'Student 1 Kumar', subject: 'Artificial Intelligence', facultyId: 'FAC003', date: '2026-08-08', status: 'Present' }
        ];
        setDB(DB_KEYS.ATTENDANCE, attendance);
      }

      if (!localStorage.getItem(DB_KEYS.MARKS)) {
        const marks = [
          { id: 'M1', studentId: 'STU001', subject: 'DBMS', semester: 'Sem 1', internal: 24, assignment: 9, mid: 22, practical: 18, external: 58, total: 91, grade: 'A+' },
          { id: 'M2', studentId: 'STU001', subject: 'Java', semester: 'Sem 1', internal: 22, assignment: 8, mid: 20, practical: 17, external: 55, total: 82, grade: 'A' },
          { id: 'M3', studentId: 'STU001', subject: 'Computer Networks', semester: 'Sem 1', internal: 20, assignment: 8, mid: 18, practical: 16, external: 50, total: 76, grade: 'B+' }
        ];
        setDB(DB_KEYS.MARKS, marks);
      }

      if (!localStorage.getItem(DB_KEYS.RESULTS)) {
        const results = [

    function getCurrentUser() {

    }

    /* ==========================================================================
       3. UI UTILITIES & TOASTS
       ========================================================================== */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast`;
      
      let icon = 'fa-info-circle';
      if (type === 'success') icon = 'fa-check-circle';
      if (type === 'danger') icon = 'fa-exclamation-circle';
      if (type === 'warning') icon = 'fa-triangle-exclamation';

      toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'toastIn 0.3s reverse ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function openModal(htmlContent) {
      const modalOverlay = document.getElementById('modalOverlay');
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = htmlContent;
      modalOverlay.classList.remove('hidden');
    }

    function closeModal() {
      const modalOverlay = document.getElementById('modalOverlay');
      modalOverlay.classList.add('hidden');
    }

    /* ==========================================================================
       4. ROUTER & NAVIGATION ENGINE
       ========================================================================== */
    let currentRoute = 'home';
    let currentSubRoute = 'dashboard';

    function navigateTo(route, subRoute = 'dashboard') {
      currentRoute = route;
      currentSubRoute = subRoute;

      // Role Security Guard
      const user = getCurrentUser();
      if (route.startsWith('student') && (!user || user.role !== 'student')) {
        showToast('Unauthorized Access! Please log in as a Student.', 'danger');
        route = 'home';
      } else if (route.startsWith('faculty') && (!user || user.role !== 'faculty')) {
        showToast('Unauthorized Access! Please log in as Faculty.', 'danger');
        route = 'home';
      } else if (route.startsWith('admin') && (!user || user.role !== 'admin')) {
        showToast('Unauthorized Access! Please log in as Admin.', 'danger');
        route = 'home';
      }

      renderApp();
      window.scrollTo(0, 0);
    }

    function renderApp() {
      const app = document.getElementById('app');
      
      if (currentRoute === 'home') {
        app.innerHTML = renderHomePage();
      } else if (currentRoute === 'student') {
        app.innerHTML = renderDashboardLayout('student', renderStudentView(currentSubRoute));
        if (currentSubRoute === 'digital-board') initStudentDigitalBoard();
      } else if (currentRoute === 'faculty') {
        app.innerHTML = renderDashboardLayout('faculty', renderFacultyView(currentSubRoute));
        if (currentSubRoute === 'digital-board') initFacultyDigitalBoard();
      } else if (currentRoute === 'admin') {
        app.innerHTML = renderDashboardLayout('admin', renderAdminView(currentSubRoute));
      }
    }

    function handleLogin(event, role) {
      event.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (!id || !pass) {
        showToast('Please enter all required fields.', 'warning');
        return;
      }

      if (role === 'student') {
        const students = getDB(DB_KEYS.STUDENTS);
        const match = students.find(s => s.hallTicket === id && s.password === pass);
        if (match) {
          setCurrentUser({ role: 'student', studentId: match.studentId, name: match.name, hallTicket: match.hallTicket, department: match.department, year: match.year, section: match.section });
          closeModal();
          showToast(`Welcome back, ${match.name}!`, 'success');
          navigateTo('student', 'dashboard');
        } else {
          showToast('Invalid Hall Ticket or Password.', 'danger');
        }
      } else if (role === 'faculty') {
        const faculties = getDB(DB_KEYS.FACULTY);
        const match = faculties.find(f => f.email === id && f.password === pass);
        if (match) {
          setCurrentUser({ role: 'faculty', facultyId: match.facultyId, name: match.name, email: match.email, department: match.department });
          closeModal();
          showToast(`Welcome back, ${match.name}!`, 'success');
          navigateTo('faculty', 'dashboard');
        } else {
          showToast('Invalid Email or Password.', 'danger');
        }
      } else if (role === 'admin') {
        const admins = getDB(DB_KEYS.ADMIN);
        const match = admins.find(a => a.email === id && a.password === pass);
        if (match) {
          setCurrentUser({ role: 'admin', adminId: match.adminId, name: match.name, email: match.email });
          closeModal();
          showToast('Admin Logged in successfully.', 'success');
          navigateTo('admin', 'dashboard');
        } else {
          showToast('Invalid Admin Credentials.', 'danger');
        }
      }
    }

              <p style="font-size:0.8rem; color:var(--text-muted);">Weekly class schedule & rooms</p>
            </div>
          </div>
        `;
      }

      if (subRoute === 'fees') {
        const fees = getDB(DB_KEYS.FEES).filter(f => f.studentId === studentId);
        const total = fees.reduce((acc, curr) => acc + Number(curr.totalAmount), 0);
        const paid = fees.reduce((acc, curr) => acc + Number(curr.paidAmount), 0);
        const pending = total - paid;

        return `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon" style="background:#dbeafe; color:var(--accent-blue);"><i class="fa-solid fa-coins"></i></div>
              <div>
                <div style="font-size:0.8rem; color:var(--text-muted);">TOTAL FEE</div>
                <div style="font-size:1.5rem; font-weight:700;">₹${total.toLocaleString()}</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:#d1fae5; color:var(--success);"><i class="fa-solid fa-circle-check"></i></div>
              <div>
                <div style="font-size:0.8rem; color:var(--text-muted);">PAID AMOUNT</div>
                <div style="font-size:1.5rem; font-weight:700; color:var(--success);">₹${paid.toLocaleString()}</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:#fee2e2; color:var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i></div>
              <div>
                <div style="font-size:0.8rem; color:var(--text-muted);">PENDING AMOUNT</div>
                <div style="font-size:1.5rem; font-weight:700; color:var(--danger);">₹${pending.toLocaleString()}</div>
              </div>
            </div>
          </div>

          <div class="data-card">
            <h3>Fee Statements & Breakdowns</h3>
            <br>
            <div class="table-responsive">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>Fee Type</th>
                    <th>Total Amount</th>
                    <th>Paid Amount</th>
                    <th>Pending</th>
                    <th>Due Date</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${fees.length > 0 ? fees.map(f => `
                    <tr>
                      <td><strong>${f.feeType}</strong></td>
                      <td>₹${Number(f.totalAmount).toLocaleString()}</td>
                      <td>₹${Number(f.paidAmount).toLocaleString()}</td>
                      <td style="color:var(--danger); font-weight:600;">₹${(Number(f.totalAmount) - Number(f.paidAmount)).toLocaleString()}</td>
                      <td>${f.dueDate}</td>
                      <td><span class="badge ${f.status === 'PAID' ? 'badge-success' : 'badge-warning'}">${f.status}</span></td>
                    </tr>
                  `).join('') : `<tr><td colspan="6" style="text-align:center;">No fee records found.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (subRoute === 'attendance') {
        const attendance = getDB(DB_KEYS.ATTENDANCE).filter(a => a.studentId === studentId);
        const totalClasses = attendance.length;
        const presentClasses = attendance.filter(a => a.status === 'Present').length;
        const percentage = totalClasses > 0 ? Math.round((presentClasses / totalClasses) * 100) : 0;

        return `
          <div class="data-card" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
            <div>
              <h3>Overall Attendance Progress</h3>
              <p style="color:var(--text-muted);">Calculated from total registered lectures</p>
              ${percentage < 75 ? `
                <div style="margin-top:0.5rem; color:var(--danger); font-weight:600;">
                  <i class="fa-solid fa-triangle-exclamation"></i> ⚠ ATTENDANCE SHORTAGE: Below 75% requirement.
                </div>
              ` : ''}
            </div>
            <div style="font-size:3rem; font-weight:800; color:${percentage < 75 ? 'var(--danger)' : 'var(--success)'};">
              ${percentage}%
            </div>
          </div>

          <div class="data-card">
            <h3>Class Logs</h3>
            <br>
            <div class="table-responsive">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Subject</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${attendance.length > 0 ? attendance.map(a => `
                    <tr>
                      <td>${a.date}</td>
                      <td>${a.subject}</td>
                      <td><span class="badge ${a.status === 'Present' ? 'badge-success' : 'badge-danger'}">${a.status}</span></td>
                    </tr>
                  `).join('') : `<tr><td colspan="3" style="text-align:center;">No attendance records found.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (subRoute === 'digital-board') {
        const boards = getDB(DB_KEYS.BOARDS);
        const latestBoard = boards.length > 0 ? boards[boards.length - 1] : null;

        return `
          <div class="data-card">
            <h3>Student Shared Blackboard (Read-Only)</h3>
            <p style="color:var(--text-muted); margin-bottom:1rem;">View live drawings, notes and figures published by faculty.</p>
            ${latestBoard ? `
              <div style="margin-bottom:1rem; font-size:0.9rem;">
                <strong>Subject:</strong> ${latestBoard.subject} | <strong>Topic:</strong> ${latestBoard.topic} | <strong>Faculty:</strong> ${latestBoard.facultyName}
              </div>
              <div class="canvas-container">
                <canvas id="studentBoardViewer" width="800" height="400"></canvas>
              </div>
            ` : `
              <div style="text-align:center; padding:3rem; color:var(--text-muted);">
                <i class="fa-solid fa-chalkboard" style="font-size:3rem; margin-bottom:1rem;"></i>
                <p>No board active or shared by faculty yet.</p>
              </div>
            `}
          </div>
        `;
      }

      // Default Fallback View for other student sections
      return `
        <div class="data-card">
          <h3>${subRoute.toUpperCase()}</h3>
          <p style="color:var(--text-muted); margin-top:0.5rem;">Academic record module for ${user.name} (${studentId}).</p>
          <br>
          <div style="padding:2rem; text-align:center; background:var(--bg-light); border-radius:8px;">
            <i class="fa-solid fa-folder-open" style="font-size:2.5rem; color:var(--accent-blue); margin-bottom:1rem;"></i>
            <p>Active records loaded dynamically from LocalStorage for this profile.</p>
          </div>
        </div>
      `;
    }

    function initStudentDigitalBoard() {
      const canvas = document.getElementById('studentBoardViewer');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const boards = getDB(DB_KEYS.BOARDS);
      if (boards.length > 0) {
        const img = new Image();
        img.src = boards[boards.length - 1].dataUrl;
        img.onload = () => ctx.drawImage(img, 0, 0);
      }
    }

    /* ==========================================================================
       8. FACULTY MODULE & INTERACTIVE DIGITAL BOARD
       ========================================================================== */
    function renderFacultyView(subRoute) {
      const user = getCurrentUser();

      if (subRoute === 'dashboard') {
        return `
          <div class="data-card" style="background: linear-gradient(135deg, #1e293b, #0f172a); color:white;">
            <h2>Welcome, ${user.name}</h2>
            <p style="color:#94a3b8; margin-top:0.25rem;">Faculty ID: ${user.facultyId} | Dept: ${user.department}</p>
          </div>

          <div class="stats-grid">
            <div class="portal-card" style="color:var(--text-main);" onclick="navigateTo('faculty', 'attendance')">
              <div class="portal-icon"><i class="fa-solid fa-calendar-check"></i></div>
              <h4>MARK ATTENDANCE</h4>
              <p style="font-size:0.8rem; color:var(--text-muted);">Register daily student presence</p>
            </div>
            <div class="portal-card" style="color:var(--text-main);" onclick="navigateTo('faculty', 'marks')">
              <div class="portal-icon"><i class="fa-solid fa-pen-to-square"></i></div>
              <h4>ENTER MARKS</h4>
              <p style="font-size:0.8rem; color:var(--text-muted);">Input internal & exam scores</p>
            </div>
            <div class="portal-card" style="color:var(--text-main);" onclick="navigateTo('faculty', 'digital-board')">
              <div class="portal-icon"><i class="fa-solid fa-display"></i></div>
              <h4>DIGITAL BOARD</h4>
              <p style="font-size:0.8rem; color:var(--text-muted);">Interactive teaching blackboard</p>
            </div>
          </div>
        `;
      }

      if (subRoute === 'attendance') {
        const students = getDB(DB_KEYS.STUDENTS);
        return `
          <div class="data-card">
            <h3>Mark Class Attendance</h3>
            <br>
            <form onsubmit="handleFacultySaveAttendance(event)">
              <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:1rem; margin-bottom:1.5rem;">
                <div>
                  <label style="font-size:0.85rem; font-weight:600;">Subject</label>
                  <select id="attSubject" class="form-control" required>
                    <option value="DBMS">DBMS</option>
                    <option value="Java">Java</option>
                    <option value="Computer Networks">Computer Networks</option>
                  </select>
                </div>
                <div>
                  <label style="font-size:0.85rem; font-weight:600;">Date</label>
                  <input type="date" id="attDate" class="form-control" value="2026-08-08" required>
                </div>
              </div>

              <div class="table-responsive">
                <table class="custom-table">
                  <thead>
                    <tr>
                      <th>Student ID</th>
                      <th>Hall Ticket</th>
                      <th>Student Name</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${students.map(s => `
                      <tr>
                        <td>${s.studentId}</td>
                        <td>${s.hallTicket}</td>
                        <td>${s.name}</td>
                        <td>
                          <label><input type="radio" name="att_${s.studentId}" value="Present" checked> Present</label>
                          &nbsp;&nbsp;
                          <label><input type="radio" name="att_${s.studentId}" value="Absent"> Absent</label>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
              <br>
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> SAVE ATTENDANCE</button>
            </form>
          </div>
        `;
      }

      if (subRoute === 'digital-board') {
        return `
          <div class="data-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:1rem;">
              <div>
                <h3>Interactive Faculty Digital Board</h3>
                <p style="font-size:0.85rem; color:var(--text-muted);">Draw, write equations, and broadcast live to student portals.</p>
              </div>
              <div class="flex gap-2">
                <button class="btn btn-secondary btn-sm" onclick="clearFacultyBoard()"><i class="fa-solid fa-trash"></i> Clear</button>
                <button class="btn btn-success btn-sm" onclick="saveAndShareBoard()"><i class="fa-solid fa-share-nodes"></i> SHARE WITH STUDENTS</button>
              </div>
            </div>

            <div class="canvas-container">
              <div class="canvas-toolbar">
                <label>Color:</label>
                <input type="color" id="boardColor" value="#000000">
                <label>Size:</label>
                <input type="range" id="boardSize" min="1" max="20" value="3">
                <button class="btn btn-secondary btn-sm" onclick="setBoardTool('pen')"><i class="fa-solid fa-pen"></i> Pen</button>
                <button class="btn btn-secondary btn-sm" onclick="setBoardTool('eraser')"><i class="fa-solid fa-eraser"></i> Eraser</button>
              </div>
              <canvas id="digitalBoardCanvas" width="800" height="450"></canvas>
            </div>
          </div>
        `;
      }

      return `<div class="data-card"><h3>${subRoute.toUpperCase()}</h3><p>Faculty portal feature module.</p></div>`;
    }

    function handleFacultySaveAttendance(event) {
      event.preventDefault();
      const subject = document.getElementById('attSubject').value;
      const date = document.getElementById('attDate').value;
      const students = getDB(DB_KEYS.STUDENTS);
      const user = getCurrentUser();

      const attendance = getDB(DB_KEYS.ATTENDANCE);

      students.forEach(s => {
        const statusVal = document.querySelector(`input[name="att_${s.studentId}"]:checked`).value;
        attendance.push({
          id: Date.now().toString() + Math.random().toString().substr(2, 4),
          studentId: s.studentId,
          studentName: s.name,
          subject: subject,
          facultyId: user.facultyId,
          date: date,
          status: statusVal
        });
      });

      setDB(DB_KEYS.ATTENDANCE, attendance);
      showToast('Attendance recorded and saved successfully!', 'success');
      navigateTo('faculty', 'dashboard');
    }

    // Digital Board Canvas Engine
    let boardCtx = null;
    let isDrawing = false;
    let currentTool = 'pen';

    function initFacultyDigitalBoard() {
      const canvas = document.getElementById('digitalBoardCanvas');
      if (!canvas) return;
      boardCtx = canvas.getContext('2d');
      
      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseleave', stopDraw);
    }

    function setBoardTool(tool) { currentTool = tool; }

    function startDraw(e) {
      isDrawing = true;
      boardCtx.beginPath();
      boardCtx.moveTo(e.offsetX, e.offsetY);
    }

    function draw(e) {
      if (!isDrawing) return;
      const color = document.getElementById('boardColor').value;
      const size = document.getElementById('boardSize').value;

      boardCtx.lineWidth = size;
      boardCtx.lineCap = 'round';

      if (currentTool === 'eraser') {
        boardCtx.strokeStyle = '#ffffff';
      } else {
        boardCtx.strokeStyle = color;
      }

      boardCtx.lineTo(e.offsetX, e.offsetY);
      boardCtx.stroke();
    }

    function stopDraw() { isDrawing = false; }

    function clearFacultyBoard() {
      const canvas = document.getElementById('digitalBoardCanvas');
      if (canvas && boardCtx) {
        boardCtx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function saveAndShareBoard() {
      const canvas = document.getElementById('digitalBoardCanvas');
      if (!canvas) return;
      const user = getCurrentUser();
      const dataUrl = canvas.toDataURL();

      const boards = getDB(DB_KEYS.BOARDS);
      boards.push({
        boardId: 'BRD_' + Date.now(),
        facultyId: user.facultyId,
        facultyName: user.name,
        subject: 'DBMS Class Note',
        topic: 'Live Canvas Diagram',
        date: '2026-08-08',
        dataUrl: dataUrl
      });

      setDB(DB_KEYS.BOARDS, boards);
      showToast('Board successfully published to student portals!', 'success');
    }

    /* ==========================================================================
       9. ADMIN MODULE & MANAGEMENT PANELS
       ========================================================================== */
    function renderAdminView(subRoute) {
      if (subRoute === 'dashboard') {
        const students = getDB(DB_KEYS.STUDENTS);
        const faculty = getDB(DB_KEYS.FACULTY);
        const admissions = getDB(DB_KEYS.ADMISSIONS);

        return `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon" style="background:#dbeafe; color:var(--accent-blue);"><i class="fa-solid fa-users"></i></div>
              <div>
                <div style="font-size:0.8rem; color:var(--text-muted);">TOTAL STUDENTS</div>
                <div style="font-size:1.5rem; font-weight:700;">${students.length}</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:#d1fae5; color:var(--success);"><i class="fa-solid fa-user-tie"></i></div>
              <div>
                <div style="font-size:0.8rem; color:var(--text-muted);">TOTAL FACULTY</div>
                <div style="font-size:1.5rem; font-weight:700;">${faculty.length}</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:#fef3c7; color:var(--warning);"><i class="fa-solid fa-user-plus"></i></div>
              <div>
                <div style="font-size:0.8rem; color:var(--text-muted);">NEW ADMISSIONS</div>
                <div style="font-size:1.5rem; font-weight:700;">${admissions.length}</div>
              </div>
            </div>
          </div>

          <div class="data-card">
            <h3>Quick Admin Operations</h3>
            <br>
            <div class="flex gap-4" style="flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="navigateTo('admin', 'students')"><i class="fa-solid fa-user-plus"></i> Manage Students</button>
              <button class="btn btn-outline" onclick="navigateTo('admin', 'admissions')"><i class="fa-solid fa-file-circle-check"></i> Admissions Portal</button>
              <button class="btn btn-secondary" onclick="navigateTo('admin', 'fees')"><i class="fa-solid fa-receipt"></i> Fee Audit</button>
            </div>
          </div>
        `;
      }

      if (subRoute === 'students') {
        const students = getDB(DB_KEYS.STUDENTS);
        return `
          <div class="data-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
              <h3>Student Management</h3>
              <button class="btn btn-primary btn-sm" onclick="showAddStudentModal()"><i class="fa-solid fa-plus"></i> ADD NEW STUDENT</button>
            </div>
            <div class="table-responsive">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Hall Ticket</th>
                    <th>Name</th>
                    <th>Dept</th>
                    <th>Year</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${students.map(s => `
                    <tr>
                      <td>${s.studentId}</td>
                      <td>${s.hallTicket}</td>
                      <td>${s.name}</td>
                      <td>${s.department}</td>
                      <td>${s.year}</td>
                      <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.studentId}')"><i class="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      return `<div class="data-card"><h3>${subRoute.toUpperCase()}</h3><p>Admin management console.</p></div>`;
    }

    function showAddStudentModal() {
      const modalHtml = `
        <h3>Add New Student</h3>
        <br>
        <form onsubmit="handleAddStudent(event)">
          <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="newStuName" class="form-control" required placeholder="e.g. Ananya Rao">
          </div>
          <div class="form-group">
            <label>Hall Ticket Number</label>
            <input type="text" id="newStuHall" class="form-control" required placeholder="e.g. 20A81A0511">
          </div>
          <div class="form-group">
            <label>Department</label>
            <select id="newStuDept" class="form-control">
              <option value="CSE">CSE</option>
              <option value="ECE">ECE</option>
              <option value="EEE">EEE</option>
            </select>
          </div>
          <div class="flex gap-2" style="margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary w-full">SAVE STUDENT</button>
            <button type="button" class="btn btn-secondary w-full" onclick="closeModal()">CANCEL</button>
          </div>
        </form>
      `;
      openModal(modalHtml);
    }

    function handleAddStudent(e) {
      e.preventDefault();
      const name = document.getElementById('newStuName').value;
      const hall = document.getElementById('newStuHall').value;
      const dept = document.getElementById('newStuDept').value;

      const students = getDB(DB_KEYS.STUDENTS);
      const newId = `STU${String(students.length + 1).padStart(3, '0')}`;

      students.push({
        studentId: newId,
        hallTicket: hall,
        name: name,
        email: `${newId.toLowerCase()}@smartcampus.edu`,
        password: 'student123',
        department: dept,
        course: 'B.Tech',
        year: '3rd Year',
        section: 'A',
        phone: '9876543210',
        academicYear: '2026-2027',
        admissionDate: '2026-08-08'
      });

      setDB(DB_KEYS.STUDENTS, students);
      closeModal();
      showToast(`Student ${name} added successfully!`, 'success');
      navigateTo('admin', 'students');
    }

    function deleteStudent(studentId) {
      if (confirm(`Are you sure you want to delete student ${studentId}?`)) {
        let students = getDB(DB_KEYS.STUDENTS);
        students = students.filter(s => s.studentId !== studentId);
        setDB(DB_KEYS.STUDENTS, students);
        showToast('Student deleted successfully', 'danger');
        navigateTo('admin', 'students');
      }
    }

    /* ==========================================================================
       10. APP INITIALIZATION
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      // Auto restore active logged in session
      const user = getCurrentUser();
      if (user) {
        navigateTo(user.role, 'dashboard');
      } else {
        navigateTo('home');
      }
    });
  </script>
</body>
</html>
